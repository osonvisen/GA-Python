<h1>Cities in {{ code }}</h1>
<form action="/cities" method="get">
<label for="country">Country code</label>
<input type="text" id="country" name="country" value="{{ code }}"
required maxlength="3">
<button type="submit">Search</button>
</form>
<ul>
{% for name, population in rows %}
<li>{{ name }}: {{ population }}</li>
{% endfor %}
</ul>
<p><a href="/">Home</a></p>
