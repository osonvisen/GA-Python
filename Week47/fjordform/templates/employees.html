{% extends "base.html" %}
{% block title %}Employees{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Employees</h1>
    <a class="btn btn-primary" href="/employee/add">+ Add employee</a>
</div>

<div class="card table-wrap">
    <table>
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Role</th>
            <th scope="col">Email</th>
        </tr>
        </thead>
        <tbody>
        {% for e in rows %}
            <tr>
                <td><a href="/employee/{{ e.id }}">{{ e.first_name }} {{ e.last_name }}</a></td>
                <td><span class="badge badge-alt">{{ e.role }}</span></td>
                <td>{{ e.email }}</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="3" class="empty">No employees found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
