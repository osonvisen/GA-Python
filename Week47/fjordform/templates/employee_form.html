{% extends "base.html" %}
{% block title %}{{ "Edit employee" if employee else "New employee" }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ "Edit employee" if employee else "New employee" }}</h1>
    <a class="btn btn-ghost" href="/employees">← Back to employees</a>
</div>

<div class="card form-card">
    <form method="post" action="{{ ('/employee/' ~ employee.id ~ '/edit') if employee else '/employee/add' }}">
        <div class="field-row">
            <div class="field">
                <label for="first_name">First name</label>
                <input id="first_name" name="first_name" maxlength="50" required
                       value="{{ employee.first_name if employee else '' }}">
            </div>
            <div class="field">
                <label for="last_name">Last name</label>
                <input id="last_name" name="last_name" maxlength="50" required
                       value="{{ employee.last_name if employee else '' }}">
            </div>
        </div>
        <div class="field">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                {% for r in roles %}
                    <option value="{{ r }}" {% if employee and r == employee.role %}selected{% endif %}>{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="100" required
                   value="{{ employee.email if employee else '' }}">
        </div>
        <div class="actions">
            <button class="btn btn-primary" type="submit">Save employee</button>
        </div>
    </form>

    {% if employee %}
        <form class="danger-zone" method="post" action="/employee/{{ employee.id }}/delete"
              onsubmit="return confirm('Delete this employee?');">
            <button class="btn btn-danger" type="submit">Delete employee</button>
        </form>
    {% endif %}
</div>
{% endblock %}
