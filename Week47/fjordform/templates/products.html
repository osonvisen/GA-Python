{% extends "base.html" %}
{% block title %}Products{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Products</h1>
    <a class="btn btn-primary" href="/product/add">+ Add product</a>
</div>

<div class="card table-wrap">
    <table>
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col" class="num">Monthly price</th>
        </tr>
        </thead>
        <tbody>
        {% for p in rows %}
            <tr>
                <td><a href="/product/{{ p.id }}">{{ p.name }}</a></td>
                <td class="muted">{{ p.description }}</td>
                <td class="num">{{ "%.2f"|format(p.monthly_price) }} kr</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="3" class="empty">No products found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
